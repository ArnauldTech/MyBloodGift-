<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My BloodGift - Donor Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "tertiary-container": "#298030",
                      "primary-container": "#d32f2f",
                      "secondary-fixed": "#d4e3ff",
                      "on-primary": "#ffffff",
                      "on-secondary-fixed-variant": "#004786",
                      "secondary-fixed-dim": "#a5c8ff",
                      "on-tertiary-container": "#daffd1",
                      "on-tertiary": "#ffffff",
                      "outline-variant": "#e4beba",

              "borderRadius": {

              "spacing": {

              "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation suppressed for transactional flow -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-lg bg-surface-container-lowest rounded-xl border border-outline-variant p-8 shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2 hidden md:block">Create Account</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2 md:hidden">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Step 1 of 3: Essential Information</p>
</div>
<!-- Progress Tracker -->
<div class="flex items-center justify-between mb-10 relative">
<div class="absolute left-0 top-1/2 w-full h-1 bg-surface-variant -z-10 translate-y-[-50%]"></div>
<div class="absolute left-0 top-1/2 w-1/3 h-1 bg-secondary -z-10 translate-y-[-50%]"></div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center font-label-md text-label-md mb-2">1</div>
<span class="font-label-sm text-label-sm text-secondary">Account</span>
</div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-2">2</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Profile</span>
</div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-2">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Health</span>
</div>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Social Login Options -->
<div class="space-y-4">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
                        Continue with Facebook
                    </button>
</div>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-sm text-label-sm">or sign up with email</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Input Fields -->
<div class="space-y-4">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullName">Full Name</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors font-body-md" id="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email Address</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors font-body-md" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors font-body-md" id="password" placeholder="Create a strong password" required="" type="password"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirmPassword">Confirm Password</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors font-body-md" id="confirmPassword" placeholder="Re-enter password" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-4 space-y-4">
<button class="w-full bg-primary-container text-on-primary-container rounded-lg py-3 px-4 font-label-md text-label-md hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
                        Continue to Next Step
                    </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant">
                        Already have an account? <a class="text-secondary hover:underline font-label-md text-label-md" href="#">Log in here</a>
</p>
</div>
</form>
</div>
</main>
<!-- Footer suppressed for transactional flow -->
</body></html>
